# 블로그/웹 페이지 한 건의 이미지를 생성·배치한다.
# v1.8.1 (2026-07-06): 정보형 5종 (simple_table, master_chart line/bar/donut/pie,
# comparison_table, key_points_card, timeline) + 감성형 1종 (ai_visual) 활성.
# deprecated: illustration (v1.8 — ai_visual 흡수), kakao_dialogue (v1.8.1 은퇴 — plan_history §1.4).
# 둘 다 backwards compat path 만 유지, 신규 trigger 는 slot_selection 단에서 차단.
name: blog_image
version: 1.1.0
description: 블로그/웹 페이지 한 건의 이미지를 생성·배치한다

input_schema:
  page_id: string
  page_source: enum [블로그, 웹]
  notion_page_blocks: array

stages:
  - name: analyze_content
    skill: meta/slot_selection.md
    tool: tools/llm/analyze_content.py
    output: { image_slots: array }
    description: |
      본문 블록을 읽고 image_slots 결정 (0개도 가능, 보통 1-3개).
      각 슬롯: { type, sub_type?, position_after_block_id, extracted_data }
      (v1.8.2 — LLM 출력은 position_after_block_index(정수), analyze_content가
       idx→block_id 변환 후 전달. 환각 원천 차단, plan §5)
      활성 type: simple_table | chart(sub_type=line|bar|donut|pie) | comparison_table |
                key_points_card | timeline | ai_visual.
      deprecated (신규 trigger X): illustration, kakao_dialogue.

  - name: generate_per_slot
    foreach: image_slots
    sub_stages:
      - name: prepare_data
        skill: image_types/{slot.type}.md
        description: extracted_data를 템플릿 variables 형태로 정규화

      - name: review_input
        skill: meta/prompt_review.md
        tool: tools/llm/review.py
        output: { passed: boolean, issues: array, revised_data: object|null }
        on_fail: revise (max 1회 — revised_data로 재시도)

      - name: generate_image
        tool: |
          if slot.type == "chart":
            tools/render/chart_render.py:render_chart  # ChartSpec(sub_type=...) — master_chart.html
          else:
            tools/render/template_render.py:render_template
        post: tools/image/webp_converter.py:png_to_webp
        output: { webp_path: string, cost_usd: float }

      - name: review_image
        skill: meta/image_review.md
        description: |
          형식 검증 (파일 존재, 크기 ≥ 1KB) + AI 카드만 vision 검수
          (text_rule=zero, Phase 4.3 — tools/llm/image_review.py).
          정보형 5종은 vision skip (template 렌더 — 텍스트 환각 위험 0).
        on_fail:
          - regenerate (max 1 회) per regen_policy.md
          - if still fail: mark slot as `failed`, continue

      - name: upload_to_notion
        tool: |
          tools/notion/upload_image.py:upload_image
          tools/notion/insert_image_block.py:insert_image_block
        output: { file_upload_id: string, new_block_id: string }

      - name: log_metadata
        tool: tools/notion/log_metadata.py:log_metadata
        description: 슬롯 단위 1행 (성공/실패 무관)

  - name: update_status
    skill: meta/regen_policy.md
    tool: tools/notion/update_status.py:update_page_status
    description: |
      완료 시 성공/실패 무관 항상 "이미지 작업 중" (v1.8.5).
      모든 완료 페이지가 사람 검수를 거침 → "발행 필요"는 검수자가 수동 승격.
      cron 은 "이미지 필요"만 fetch 하므로 이 라벨은 재처리 트리거 아님.

# 비용 가드 — 상수값 SSOT는 tools/limits.py (plan §6). 본 yaml에 숫자 복사 X.
# (drift 방지 — 2026-07-06 구식 값 $1.00/$3.00이 실값 $2.50/$8.00과 어긋난 채 방치된 사례로 원칙 확정)
limits:
  source: tools/limits.py
  # 관련 상수: PER_PAGE_CAP_USD / PER_PAGE_TARGET_USD / PER_RUN_CAP_USD /
  #           PER_SLOT_COST_CAP_USD / PER_SLOT_ATTEMPTS /
  #           MAX_USER_PROMPT_CHARS / MAX_BLOCKS_PROMPT_CHARS (§19.8 압축 진입 임계)
