[project]
name = "content-image-agent"
version = "0.1.0"
description = "법무법인 이현 블로그/웹 콘텐츠용 이미지 자동 생성 에이전트"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "lawfirm-ehyun" }]

dependencies = [
    "claude-agent-sdk>=0.1.77",
    "notion-client>=2.2.1",
    "playwright>=1.48.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "tenacity>=9.0.0,<11.0.0",
    "rapidfuzz>=3.0.0,<4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
