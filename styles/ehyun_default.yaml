# styles/ehyun_default.yaml
# 이현 디자인 토큰 v1 — Phase 1
#
# 핵심 원칙: 모바일 가독성 우선. 1200px wide 카드 기준 모든 본문 텍스트 최소 28px.
#
# 컬러 시스템 (B+C 안):
#   - brand: wine-magenta (#a91c51) monochromatic
#   - neutral: Tailwind Zinc (true neutral, brand와 언더톤 충돌 X)
#   - chart.secondary는 primary의 desaturated 변형 → 토스피드 "navy → light blue" 패턴 차용

colors:
  brand:
    primary: '#a91c51'        # 강조 - 표 한 컬럼/행, 차트 메인 라인, 강조 텍스트
    primary_dark: '#7d1239'   # 면적 큰 강조 (호버, stacked bar 한 칸 등)
    primary_soft: '#fdf2f5'   # 강조 영역 배경 (연한 핑크 톤)

  # 차트 multi-series 컬러 — monochromatic plum 계열
  chart:
    primary: '#a91c51'        # 메인 계열 (=brand.primary)
    secondary: '#c98497'      # 보조 계열 (primary 채도 낮춘 desaturated 톤)
    tertiary: '#a1a1aa'       # 3계열 fallback (mid-gray, =neutral.400)
    accent_warm: '#d97706'    # 강조 1포인트 (토스피드 orange 역할, 거의 안 씀)

  # neutral — Tailwind Zinc (true neutral)
  neutral:
    900: '#18181b'   # 가장 진한 글자, 다크 카드 배경
    800: '#27272a'   # 큰 제목
    700: '#3f3f46'   # 본문 글자 (기본)
    600: '#52525b'   # 보조 글자
    500: '#71717a'   # 캡션
    400: '#a1a1aa'   # 출처/메타
    300: '#d4d4d8'   # 보더 (연한)
    200: '#e4e4e7'   # 보더 (더 연한)
    100: '#f4f4f5'   # 셀 배경 (회색 헤더)
    50:  '#fafafa'   # 카드 배경 (옵션)
    0:   '#ffffff'   # 기본 배경

  accent:  # 거의 안 씀. 90%는 흑백 + brand.primary
    success: '#16a34a'  # ✓ 표시 등 (key_points_card checked variant)
    warning: '#f59e0b'  # 주의 표시

typography:
  font_family: 'Pretendard, -apple-system, BlinkMacSystemFont, sans-serif'
  weights: { regular: 400, medium: 500, semibold: 600, bold: 700 }

  # 1200px wide 카드 기준 모바일 가독성 우선
  # 모든 본문 텍스트 최소 28px (production 검증 기준)
  sizes:
    display: 96px       # stat_highlight 메가 숫자 ("638억")
    h1: 52px            # 카드 메인 제목
    h2: 38px            # 부제 / 차트 제목
    body_large: 34px    # key_points_card 항목 등 본문 큰 글씨
    body: 30px          # 표 헤더, 일반 본문
    body_sm: 28px       # 표 본문 셀 (절대 minimum)
    caption: 24px       # 차트 축 라벨, 캡션
    small: 20px         # 출처/메타 (출처는 가독성 양보 OK)

  line_heights: { tight: 1.15, snug: 1.3, normal: 1.5 }

spacing:  # px
  xs: 4
  sm: 8
  md: 16
  lg: 24
  xl: 32
  '2xl': 48
  '3xl': 64

radius:  # px
  sm: 4
  md: 8
  lg: 12
  xl: 20

# 카드 사이즈 정책
#   - default(노션 inline): 너비만 고정(1200px), 세로는 콘텐츠 fit. height: auto.
#   - square / vertical: 인스타그램 등 fixed-aspect 채널용. Phase 2+ 활용.
# 1200×675 같은 16:9 fixed 비율은 폐기 — 표/차트 콘텐츠 분량에 따라 시각 균형 깨짐.
card_sizes:
  default:  { width: 1200, height: auto, note: '본문 inline. 콘텐츠 fit.' }
  square:   { width: 1080, height: 1080, ratio: '1:1', note: '인스타용. Phase 2+' }
  vertical: { width: 1080, height: 1350, ratio: '4:5', note: '인스타용. Phase 2+' }

# 카드 공통 룰
card_defaults:
  padding: 64px
  background: '#ffffff'
  text_color: '#27272a'    # neutral.800
