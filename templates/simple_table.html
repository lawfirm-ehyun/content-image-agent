<!doctype html>
<!--
  simple_table.html — Phase 1
  토스피드 시드(reference_library/simple_table/tmp_kor_02.png, tmp_kor_05.png) 1:1 재현.

  Variables (Jinja2):
    title              : str | None        — 표 위 제목 (h2 38px). 없으면 표만 렌더.
    headers            : list[str]         — 헤더 행 셀.
    rows               : list[list[str]]   — 본문 행 (셀 개수 = headers 길이).
    footnote           : str | None        — "* 자료: ..." 형태의 출처 문자열 (옵션).
    highlight_first_col: bool              — 좌측 키 컬럼을 회색 배경/회색 글자로 (시드 tmp_kor_05 패턴).
                                             default False (tmp_kor_02 패턴).

  주의:
    - 셀 정렬은 시드 기준 center-center. plan §7.2의 "첫 컬럼 좌측"과 어긋나지만 시드(=비주얼 진실) 우선.
    - 데이터 무결성: 본문 텍스트 1자도 변형 금지 (AGENT_GUIDE 절대 룰 #1). 행 추가/축약 금지.
    - 모든 셀 텍스트 최소 28px (모바일 가독성 게이트).
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_base.css" />
  <style>
    .card { /* default 1200x675; 행이 많으면 caller가 height auto 또는 vertical로 override */
      gap: var(--sp-xl);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;     /* 컬럼 폭 균등, 셀 잘림 방지를 위해 word-break은 셀에서 */
    }

    .table thead th {
      background: var(--neutral-100);
      color: var(--neutral-500);
      font-size: var(--font-body);          /* v1.3: 42px */
      font-weight: var(--fw-medium);
      /* v1.3: 위아래 sp-xl (40), 좌우 sp-md (20) — 좌우 padding 줄여 텍스트 가용 폭 확보. */
      padding: var(--sp-xl) var(--sp-md);
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid var(--neutral-200);
      line-height: var(--lh-snug);
      word-break: keep-all;                 /* 한국어 헤더 가독성 */
    }

    .table tbody td {
      background: var(--neutral-0);
      color: var(--neutral-800);
      font-size: var(--font-body-sm);       /* v1.3: 40px (모바일 표시 ~12px) */
      font-weight: var(--fw-regular);
      /* 좌우 padding sp-md (20) — 키 컬럼에 긴 라벨(6-7자) 들어갈 여유 확보. */
      padding: var(--sp-xl) var(--sp-md);
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid var(--neutral-200);
      /* 한국어 가독성: 셀은 행간 넉넉히 (1.5). _base의 keep-all/letter-spacing 상속됨. */
      line-height: var(--lh-normal);
    }

    .table tbody tr:last-child td { border-bottom: none; }

    /* 좌측 키 컬럼 — tmp_kor_05 시드 패턴.
     * v1.3: 키 라벨이 짧으면 한 줄, 길면 (6-7자 "계약갱신청구권") 두 줄 자연 줄바꿈.
     * nowrap 제거 — 25% 폭 + 40px 폰트로 한 줄 5자 한계라 6자+ overflow 발생했음.
     * keep-all + 띄어쓰기 기준 줄바꿈은 _base.css가 담당. */
    .table.has-key-col tbody td:first-child {
      background: var(--neutral-100);
      color: var(--neutral-500);
      font-weight: var(--fw-regular);
    }
    /* 1열 폭 28% — 7자 한글 라벨 한 줄 수용 (가용 텍스트 폭 ~260px) */
    .table.has-key-col thead th:first-child,
    .table.has-key-col tbody td:first-child {
      width: 28%;
    }

    /* 헤더의 첫 컬럼도 같이 톤 매칭 (시드는 헤더 첫 컬럼이 같은 회색) */
    .table.has-key-col thead th:first-child {
      /* 헤더는 이미 neutral.100. 색 차이 없으니 그대로 둠. */
    }

    .footnote {
      /* v1.4: footnote 폰트/색 일관성 — 32px caption + neutral-500.
       * 모바일 30% 축소 시 ~10px 가독 (26px는 ~8px 한계). 7개 카드 모두 통일. */
      font-size: var(--font-caption);        /* 32px */
      color: var(--neutral-500);
      font-weight: var(--fw-regular);
      margin-top: var(--sp-lg);
      line-height: var(--lh-snug);
    }
  </style>
</head>
<body>
  <div class="card">
    {% if title %}
      <h2 class="card__title">{{ title }}</h2>
    {% endif %}

    <table class="table {% if highlight_first_col %}has-key-col{% endif %}">
      <thead>
        <tr>
          {% for h in headers %}<th>{{ h }}</th>{% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            {% for cell in row %}<td>{{ cell }}</td>{% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>

    {% if footnote %}
      <p class="footnote">{{ footnote }}</p>
    {% endif %}
  </div>
</body>
</html>
