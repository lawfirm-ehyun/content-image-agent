<!doctype html>
<!--
  chart_line.html — Phase 1
  토스피드 시드(reference_library/chart/infographic.jpg, tmp_kor_03.png) 패턴 재현.
  단일 계열 시계열 라인 차트. brand.primary로 라인/포인트, 모든 포인트 위 데이터 라벨.

  Variables (Jinja2):
    title        : str             — h2 38px, top-left.
    y_unit       : str | None      — y축 단위 캡션 ("(%)", "(억 원)" 등). 없으면 미표시.
    labels       : list[str]       — x축 1행 라벨 (보통 연도).
    sub_labels   : list[str] | None — x축 2행 라벨 (예: 개최도시명). 길이 = labels.
    values       : list[number]    — y값. 길이 = labels.
    point_labels : list[str]       — 각 포인트 위 표시 텍스트 (보통 "44.6", "638억 원").
    source       : str | None      — 출처 문구 ("출처: 골프 다이제스트, 2025"). 없으면 미표시.
    y_min        : number | None   — y축 최솟값 (옵션, 미지정 시 Chart.js auto).
    y_max        : number | None   — y축 최댓값 (옵션).

  주의:
    - 데이터 무결성: values/labels 1:1 본문 일치 (AGENT_GUIDE 절대 룰 #1).
    - point_labels는 caller가 단위/포맷팅 책임 (예: "44.6" vs "44.6%" vs "약 44.6%").
    - 모든 차트 라벨 최소 24px (caption). 출처는 20px small까지 OK.
    - 시드는 y축 표시되어 있어 plan §7.3 "y_axis 숨김"과 어긋남. 시드 우선 = y축 라벨 표시.
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_base.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    .card {
      background: var(--neutral-100);     /* 시드 패턴: 카드 전체 light-gray 배경 */
      gap: var(--sp-lg);
    }
    .chart-wrap {
      flex: 1;
      position: relative;
      min-height: 0;                      /* flex 자식 canvas 높이 계산 안정화 */
    }
    .footnote {
      font-size: var(--font-small);
      color: var(--neutral-400);
      line-height: var(--lh-snug);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card__title">{{ title }}</h2>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

    {% if source %}
      <p class="footnote">{{ source }}</p>
    {% endif %}
  </div>

  <script>
    // 데이터 (Jinja2가 안전하게 JSON으로 직렬화하도록 |tojson 사용)
    const LABELS       = {{ labels       | tojson }};
    const SUB_LABELS   = {{ sub_labels   | tojson if sub_labels else 'null' }};
    const VALUES       = {{ values       | tojson }};
    const POINT_LABELS = {{ point_labels | tojson }};
    const Y_UNIT       = {{ y_unit       | tojson if y_unit else 'null' }};
    const Y_MIN        = {{ y_min        | tojson if y_min is not none else 'null' }};
    const Y_MAX        = {{ y_max        | tojson if y_max is not none else 'null' }};

    // 토큰 (CSS var를 JS에서 읽어 Chart.js에 주입)
    const css = getComputedStyle(document.documentElement);
    const COLOR_PRIMARY  = css.getPropertyValue('--brand-primary').trim();
    const COLOR_AXIS     = css.getPropertyValue('--neutral-500').trim();
    const COLOR_GRID     = css.getPropertyValue('--neutral-200').trim();
    const COLOR_LABEL    = css.getPropertyValue('--neutral-900').trim();
    const FONT_FAMILY    = css.getPropertyValue('--font-family').trim();

    // x축 2행 라벨: ["2010", "밴쿠버"] 형태로 배열 반환 → Chart.js가 자동으로 줄바꿈
    const xLabels = SUB_LABELS
      ? LABELS.map((l, i) => [l, SUB_LABELS[i]])
      : LABELS;

    // 모든 포인트 위에 라벨 그리는 custom plugin (chartjs-plugin-datalabels 의존성 회피)
    const datalabelsPlugin = {
      id: 'pointLabels',
      afterDatasetsDraw(chart) {
        const { ctx, data, scales: { x, y } } = chart;
        ctx.save();
        ctx.font = `700 28px ${FONT_FAMILY}`;
        ctx.fillStyle = COLOR_LABEL;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        data.datasets[0].data.forEach((v, i) => {
          const px = x.getPixelForValue(i);
          const py = y.getPixelForValue(v);
          ctx.fillText(POINT_LABELS[i], px, py - 16);  // 포인트 위 16px gap
        });
        ctx.restore();
      },
    };

    // y축 단위 캡션 ("(%)" 등)을 plot 좌상단에 그리는 plugin
    const yUnitPlugin = {
      id: 'yUnitCaption',
      afterDraw(chart) {
        if (!Y_UNIT) return;
        const { ctx, chartArea, scales: { y } } = chart;
        ctx.save();
        ctx.font = `400 24px ${FONT_FAMILY}`;
        ctx.fillStyle = COLOR_AXIS;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        // y축 라벨 영역 위쪽에 표시
        ctx.fillText(Y_UNIT, chartArea.left - 60, y.top - 8);
        ctx.restore();
      },
    };

    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: xLabels,
        datasets: [{
          data: VALUES,
          borderColor: COLOR_PRIMARY,
          backgroundColor: COLOR_PRIMARY,
          borderWidth: 4,
          pointRadius: 8,
          pointBackgroundColor: COLOR_PRIMARY,
          pointBorderColor: COLOR_PRIMARY,
          pointHoverRadius: 8,
          tension: 0,                     // 시드는 직선 연결 (no smoothing)
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,                 // headless 렌더 = 프레임 안정화
        layout: { padding: { top: 56, right: 32, bottom: 8, left: 8 } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: {
            grid: { display: false, drawBorder: false },
            border: { display: false },
            ticks: {
              color: COLOR_AXIS,
              font: { family: FONT_FAMILY, size: 24, weight: '400' },
              padding: 12,
            },
          },
          y: {
            min: Y_MIN ?? undefined,
            max: Y_MAX ?? undefined,
            grid: { color: COLOR_GRID, drawTicks: false },
            border: { display: false },
            ticks: {
              color: COLOR_AXIS,
              font: { family: FONT_FAMILY, size: 24, weight: '400' },
              padding: 16,
              maxTicksLimit: 6,
            },
          },
        },
      },
      plugins: [datalabelsPlugin, yUnitPlugin],
    });
  </script>
</body>
</html>
